image: mcr.microsoft.com/dotnet/sdk:10.0
stages:
  - build
  - test
  - publish
  - deploy
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never
build:
  stage: build
  script:
    - dotnet restore
    - dotnet build --configuration Release --no-restore

test:
  stage: test
  script:
    - dotnet test -c Release
 